<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eno Solutions · Webleads</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #EFF2F7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 16px 48px;
    }
    .back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #6b7280; text-decoration: none; margin-bottom: 20px; align-self: flex-start; }
    .back:hover { color: #111827; }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      padding: 40px 44px;
      width: 100%;
      max-width: 500px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      border-bottom: 1.5px solid #F0F1F3;
      padding-bottom: 24px;
    }
    .logo {
      width: 44px; height: 44px;
      background: #7c3aed;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 18px; font-weight: 700; color: #111827; letter-spacing: -0.3px; }
    .header-text p  { font-size: 13px; color: #6B7280; margin-top: 2px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 7px; }
    label .required { color: #EF4444; margin-left: 2px; }
    label .optional { font-size: 11px; font-weight: 400; color: #9CA3AF; margin-left: 4px; }
    input[type="text"], input[type="tel"], input[type="email"] {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #D1D5DB; border-radius: 8px;
      font-size: 14px; color: #111827; background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
    }
    .field-hint { font-size: 12px; color: #9CA3AF; margin-top: 5px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .btn {
      width: 100%; padding: 13px;
      background: #7c3aed; color: #fff; border: none; border-radius: 9px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover:not(:disabled) { background: #6d28d9; }
    .btn:active:not(:disabled) { transform: scale(0.99); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .status {
      margin-top: 20px; padding: 13px 16px; border-radius: 9px;
      font-size: 14px; line-height: 1.5; display: none;
    }
    .status.success { display: block; background: #ECFDF5; color: #065F46; border: 1.5px solid #A7F3D0; }
    .status.error   { display: block; background: #FEF2F2; color: #991B1B; border: 1.5px solid #FECACA; }
    .status.loading { display: block; background: #EFF6FF; color: #1E40AF; border: 1.5px solid #BFDBFE; }
    .spinner {
      width: 16px; height: 16px;
      border: 2.5px solid currentColor; border-right-color: transparent;
      border-radius: 50%; animation: spin 0.55s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { margin-top: 24px; font-size: 12px; color: #9CA3AF; text-align: center; }
    .debug-link { font-size: 12px; color: #9CA3AF; text-align: center; margin-top: 12px; }
    .debug-link a { color: #7c3aed; text-decoration: none; }
    .debug-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<a class="back" href="/">← Back to tools</a>

<div class="card">
  <div class="header">
    <div class="logo">📋</div>
    <div class="header-text">
      <h1>Webleads</h1>
      <p>Add a contact to the ZCC address book</p>
    </div>
  </div>

  <form id="form" novalidate>
    <div class="form-row">
      <div class="form-group">
        <label for="firstName">First Name<span class="required">*</span></label>
        <input type="text" id="firstName" placeholder="Jane" required />
      </div>
      <div class="form-group">
        <label for="lastName">Last Name<span class="required">*</span></label>
        <input type="text" id="lastName" placeholder="Smith" required />
      </div>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number<span class="required">*</span></label>
      <input type="tel" id="phone" placeholder="+447700900000" required />
      <p class="field-hint">E.164 format — country code + number, no spaces</p>
    </div>

    <div class="form-group">
      <label for="email">Email Address<span class="optional">(optional)</span></label>
      <input type="email" id="email" placeholder="jane@example.com" />
    </div>

    <div class="form-group">
      <label for="company">Company<span class="optional">(optional)</span></label>
      <input type="text" id="company" placeholder="Acme Ltd" />
    </div>

    <button type="submit" class="btn" id="submitBtn">Add to Webleads</button>
  </form>

  <div class="status" id="status" role="alert" aria-live="polite"></div>

  <p class="footer">ZCC Webleads Address Book</p>
  <p class="debug-link"><a href="#" id="debugLink">Check address book ID</a></p>
</div>

<script>
  const API_BASE = 'https://app.eno.solutions';
  const ADMIN_TOKEN = 'CSTSyHD7vwNKxj9ZvaSk0Vr8GBl8rlqAw';

  function apiHeaders() {
    return { 'Content-Type': 'application/json', 'X-Admin-Token': ADMIN_TOKEN };
  }

  const form       = document.getElementById('form');
  const submitBtn  = document.getElementById('submitBtn');
  const statusDiv  = document.getElementById('status');
  const debugLink  = document.getElementById('debugLink');

  function showStatus(type, html) {
    statusDiv.className = 'status ' + type;
    statusDiv.innerHTML = html;
  }

  function val(id) { return document.getElementById(id).value.trim(); }

  function isE164(v) { return /^\+[1-9]\d{7,14}$/.test(v); }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const firstName = val('firstName');
    const lastName  = val('lastName');
    const phone     = val('phone');
    const email     = val('email');
    const company   = val('company');

    if (!firstName) { showStatus('error', 'Please enter a first name.'); return; }
    if (!lastName)  { showStatus('error', 'Please enter a last name.'); return; }
    if (!isE164(phone)) { showStatus('error', 'Phone must be in E.164 format (e.g. +447700900000).'); document.getElementById('phone').focus(); return; }

    submitBtn.disabled = true;
    showStatus('loading', '<span class="spinner"></span>&nbsp; Adding contact…');

    const contact = { first_name: firstName, last_name: lastName, phone: phone };
    if (email)   contact.email_addresses = [{ email }];
    if (company) contact.company = company;

    try {
      const res = await fetch(`${API_BASE}/address-books/webleads/contacts`, {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify(contact),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        showStatus('success', `&#10003;&nbsp; ${firstName} ${lastName} added to Webleads.`);
        form.reset();
      } else {
        const msg = data?.error?.message || data?.error || data?.message || JSON.stringify(data);
        showStatus('error', '&#10007;&nbsp; ' + msg);
      }
    } catch (err) {
      showStatus('error', '&#10007;&nbsp; Network error: ' + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  debugLink.addEventListener('click', async (e) => {
    e.preventDefault();
    debugLink.textContent = 'Checking…';
    try {
      const res = await fetch(`${API_BASE}/zoom/api/debug/webleads`, { headers: apiHeaders() });
      const data = await res.json().catch(() => ({}));
      debugLink.textContent = 'Address book ID: ' + (data.address_book_id || JSON.stringify(data));
    } catch (err) {
      debugLink.textContent = 'Error: ' + err.message;
    }
  });
</script>
</body>
</html>
